# Honeygrid Agent Configuration
# Prefer lab-safe defaults. Override only intentionally.

# Prefer HTTPS. Cleartext HTTP requires allow_insecure_http: true
api_endpoint: "https://localhost:8000/api/v1/ingest"

# Prefer env HONEYGRID_API_TOKEN; this is a last-resort local lab override
# api_token: ""
require_api_token: true
allow_insecure_http: false

# Default localhost-only bind. Use 0.0.0.0 only on isolated honeypot hosts.
bind_host: "127.0.0.1"

# High ports avoid colliding with real SSH/HTTP/SMB on developer machines
ports:
  - 2222
  - 8080

max_workers: 32
log_level: "INFO"
