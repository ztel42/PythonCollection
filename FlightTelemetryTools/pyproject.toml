[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-telemetry"
version = "0.1.0"
description = "Parse DJI .SRT telemetry to GPX/KML and burn altitude/speed HUD into video"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zach Telford" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
flight-telemetry = "flight_telemetry.cli:main"

[tool.setuptools.packages.find]
include = ["flight_telemetry*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
